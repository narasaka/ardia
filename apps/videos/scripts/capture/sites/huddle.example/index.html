<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly sync · Huddle</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --bg: #17191c; --tile: #26292e; --tile2: #2f3338; --ink: #eef0f2; --dim: #9aa1a9; --red: #e5484d; --green: #1f9d6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 24px 10px; }
  .brand { width: 26px; height: 26px; border-radius: 7px; background: var(--green); display: grid; place-items: center; }
  .title { font-weight: 650; font-size: 17px; }
  .sub { color: var(--dim); font-size: 14px; }
  .rec { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  main { flex: 1; min-height: 0; display: flex; padding: 8px 24px 0; }
  #lobby { flex: 1; display: flex; align-items: center; justify-content: center; gap: 56px; }
  #lobby .preview { width: 520px; aspect-ratio: 16 / 9; border-radius: 16px; background: var(--tile); display: grid; place-items: center; position: relative; }
  #lobby .preview .label { position: absolute; left: 14px; bottom: 12px; color: var(--dim); font-size: 13px; }
  .ready h1 { margin: 0 0 6px; font-size: 28px; font-weight: 600; }
  .ready p { margin: 0 0 22px; color: var(--dim); }
  #join { font: inherit; font-weight: 600; font-size: 16px; color: #fff; background: var(--green); border: 0; border-radius: 22px; padding: 12px 30px; cursor: pointer; }
  #call { flex: 1; display: none; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; padding-bottom: 12px; }
  body.joined #lobby { display: none; }
  body.joined #call { display: grid; }
  body.joined footer { visibility: visible; }
  .tile { position: relative; border-radius: 16px; overflow: hidden; background: var(--tile); display: grid; place-items: center; min-height: 0; }
  #me { grid-row: 1 / span 2; background: #000; }
  #me video { width: 100%; height: 100%; object-fit: cover; }
  .avatar { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 600; color: #fff; }
  .name { position: absolute; left: 12px; bottom: 10px; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.45); font-size: 13px; font-weight: 550; }
  .talking { box-shadow: inset 0 0 0 3px var(--green); }
  footer { visibility: hidden; display: flex; justify-content: center; gap: 14px; padding: 6px 0 18px; }
  .btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--tile2); display: grid; place-items: center; }
  .btn.leave { width: 72px; border-radius: 24px; background: var(--red); }
  svg { display: block; }
  .pip { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
  .pip #me { flex: 1; border-radius: 0; }
  .pip .bar { display: flex; justify-content: center; gap: 10px; padding: 8px; }
  .pip .btn { width: 36px; height: 36px; }
  .pip .btn.leave { width: 54px; }
</style>
</head>
<body>
<header>
  <div class="brand"><svg width="16" height="16" viewBox="0 0 32 32"><rect x="2" y="8" width="18" height="16" rx="4" fill="#fff"/><path d="M22 14 30 9v14l-8-5z" fill="#fff"/></svg></div>
  <div><div class="title">Weekly sync</div><div class="sub">Priya, Sam and you</div></div>
  <div class="rec"><span class="dot"></span><span id="clock">00:00</span></div>
</header>
<main>
  <section id="lobby">
    <div class="preview"><div class="avatar" style="background:#5b6ee1">Y</div><div class="label">Your camera starts when you join</div></div>
    <div class="ready"><h1>Ready to join?</h1><p>Priya and Sam are in the call</p><button id="join">Join now</button></div>
  </section>
  <section id="call">
    <div class="tile talking" id="me"><video muted playsinline></video><div class="name">You</div></div>
    <div class="tile"><div class="avatar" style="background:#c2410c">PN</div><div class="name">Priya Nair</div></div>
    <div class="tile"><div class="avatar" style="background:#0f766e">SO</div><div class="name">Sam Ortiz</div></div>
  </section>
</main>
<footer id="controls">
  <button class="btn" title="Microphone"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef0f2" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="btn" title="Camera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eef0f2" stroke-width="2" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3z"/></svg></button>
  <button class="btn leave" title="Leave call"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 9c-3.2 0-6.2.9-8.6 2.5-.6.4-.8 1.2-.4 1.8l1.3 1.9c.4.6 1.2.8 1.8.4l2.1-1.3c.4-.3.6-.8.5-1.3l-.3-1.3c1.2-.4 2.4-.6 3.6-.6s2.4.2 3.6.6l-.3 1.3c-.1.5.1 1 .5 1.3l2.1 1.3c.6.4 1.4.2 1.8-.4l1.3-1.9c.4-.6.2-1.4-.4-1.8C18.2 9.9 15.2 9 12 9z"/></svg></button>
</footer>
<script>
  window.__pip = 0; window.__pipClosed = 0; window.__pipError = null; window.__asked = [];
  let started = Date.now() - 754000;
  const tick = () => { const s = Math.floor((Date.now() - started) / 1000); document.getElementById("clock").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  tick(); setInterval(tick, 500);
  const me = document.getElementById("me");
  const call = document.getElementById("call");
  const controls = document.getElementById("controls");
  navigator.mediaSession.setActionHandler("enterpictureinpicture", async () => {
    __asked.push(document.visibilityState);
    if (document.visibilityState !== "hidden") return;
    __pip++;
    try {
      const w = await documentPictureInPicture.requestWindow({ width: 400, height: 270 });
      [...document.styleSheets].forEach((sheet) => { const s = w.document.createElement("style"); s.textContent = [...sheet.cssRules].map((r) => r.cssText).join("\n"); w.document.head.append(s); });
      w.document.title = "Weekly sync";
      w.document.body.className = "pip";
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.append(...[...controls.children].map((b) => b.cloneNode(true)));
      w.document.body.append(me, bar);
      me.querySelector("video").play();
      w.addEventListener("pagehide", () => { __pipClosed++; call.prepend(me); me.querySelector("video").play(); });
    } catch (e) { __pipError = e.name; }
  });
  window.join = () => navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }).then((s) => {
    window.__stream = s; const v = me.querySelector("video"); v.srcObject = s; v.play(); started = Date.now() - 754000; tick(); document.body.classList.add("joined"); return "ok";
  }, (e) => e.name);
  document.getElementById("join").addEventListener("click", () => join());
  window.state = () => ({ pip: __pip, open: !!documentPictureInPicture.window, closed: __pipClosed, error: __pipError,
    camera: window.__stream?.getVideoTracks()[0]?.readyState ?? null, visibility: document.visibilityState, asked: __asked, joined: document.body.classList.contains("joined") });
</script>
</body>
</html>
