name: Linux

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libnotify4 libxss1 libxtst6 libsecret-1-0 jq x11-utils
      - run: pnpm install --frozen-lockfile
      - name: Electron
        run: |
          node node_modules/electron/install.js
          node_modules/electron/dist/electron --version
      - name: Typecheck
        run: |
          pnpm -C apps/browser/linux typecheck
          if [ -f packages/expo-linux/tsconfig.json ]; then pnpm -C packages/expo-linux typecheck; fi
      - name: Build
        run: pnpm -C apps/browser/linux build
      - name: Package
        run: pnpm -C apps/browser/linux package --arch ${{ matrix.arch }}
      - name: Sandbox on this runner
        run: |
          source apps/browser/linux/packaging/sandbox.sh
          ardia_sandbox_decide node_modules/electron/dist/electron
          echo "flags: ${ARDIA_SANDBOX_FLAGS[*]:-none} ($ARDIA_SANDBOX_REASON)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Launch the build
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1600x1000x24" scripts/linux/launch-smoke "$RUNNER_TEMP/smoke-checkout" --port 9390
      - name: Launch the AppImage
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cp apps/browser/linux/dist/*.AppImage "$RUNNER_TEMP/appimage/"
          (cd "$RUNNER_TEMP/appimage" && ./*.AppImage --appimage-extract > /dev/null)
          xvfb-run -a -s "-screen 0 1600x1000x24" scripts/linux/launch-smoke "$RUNNER_TEMP/smoke-appimage" --port 9391 --app "$RUNNER_TEMP/appimage/squashfs-root"
      - name: Check the .deb
        run: |
          deb=$(ls apps/browser/linux/dist/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'opt/Ardia/(ardia|ardia.bin|chrome-sandbox)$'
          dpkg-deb -e "$deb" "$RUNNER_TEMP/deb-control"
          grep -q 'chmod 4755' "$RUNNER_TEMP/deb-control/postinst"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          grep -q '^StartupWMClass=ardia$' "$RUNNER_TEMP"/deb-root/usr/share/applications/ardia.desktop
          grep -q 'x-scheme-handler/https' "$RUNNER_TEMP"/deb-root/usr/share/applications/ardia.desktop
      - name: Install the .deb and launch it sandboxed
        timeout-minutes: 6
        run: |
          sudo apt-get install -y -qq "$PWD/$(ls apps/browser/linux/dist/*.deb)"
          stat -c '%U %a %n' /opt/Ardia/chrome-sandbox | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(stat -c '%U %a' /opt/Ardia/chrome-sandbox)" = "root 4755" ]
          xvfb-run -a -s "-screen 0 1600x1000x24" scripts/linux/launch-smoke "$RUNNER_TEMP/smoke-deb" --port 9392 --app /opt/Ardia
          head -1 "$RUNNER_TEMP/smoke-deb/data/launch.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "launch sandboxed with" "$RUNNER_TEMP/smoke-deb/data/launch.log"
          sudo apt-get remove -y -qq ardia
      - name: Screenshots in the summary
        if: ${{ !cancelled() }}
        run: |
          for shot in "$RUNNER_TEMP"/smoke-*/screenshots/*.png; do [ -f "$shot" ] && echo "- $(basename "$(dirname "$(dirname "$shot")")")/$(basename "$shot")" >> "$GITHUB_STEP_SUMMARY"; done
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launch-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/smoke-*/screenshots
            ${{ runner.temp }}/smoke-*/instance.log
            ${{ runner.temp }}/smoke-*/data/launch.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-linux-${{ matrix.arch }}
          path: |
            apps/browser/linux/dist/*.AppImage
            apps/browser/linux/dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
